worker_processes auto;
events { worker_connections 1024; }
http {
  server_tokens off; client_max_body_size 1m; gzip on; gzip_types text/css application/javascript application/json text/csv;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  include /etc/nginx/mime.types;
  upstream app { server app:8000; keepalive 16; }
  server { listen 80; return 301 https://$host$request_uri; }
  server {
    listen 443 ssl; http2 on;
    ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem; ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s; proxy_connect_timeout 5s;
    location = /api/login { limit_req zone=login burst=5 nodelay; proxy_pass http://app; }
    location = /api/metrics { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all; proxy_pass http://app; }   # только внутренним сетям / Prometheus
    location /api/ { limit_req zone=api burst=60 nodelay; proxy_pass http://app; }
    location /ds/ { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all; proxy_pass http://app; }                  # внутренний DS-сервис
    location / { proxy_pass http://app; }
  }
}
