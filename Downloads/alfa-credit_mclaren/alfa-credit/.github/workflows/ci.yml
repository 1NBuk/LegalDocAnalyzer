name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {db: [sqlite, postgres]}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: alfa, POSTGRES_PASSWORD: alfa, POSTGRES_DB: alfa}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U alfa" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest -q
        env:
          DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://alfa:alfa@localhost:5432/alfa' || '' }}
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alfa-credit backend
      - run: docker run --rm alfa-credit python -c "import app.main"
